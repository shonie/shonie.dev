<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="styles/colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html {
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    scroll-padding-top: var(--header-height);
  }
  body {
    background: var(--brand-gradient); background-attachment: fixed;
    color: var(--foreground); font-family: var(--font-roboto); letter-spacing: var(--body-tracking);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  a { color: var(--mint); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .hide-mobile { display: flex; }
  .show-mobile { display: none; }

  @media (max-width: 900px) {
    .hide-mobile { display: none !important; }
    .show-mobile { display: flex !important; }
    .hero-split { grid-template-columns: 1fr !important; gap: 32px !important; }
    .stack-grid, .bring-grid, .review-grid, .contact-grid { grid-template-columns: 1fr !important; }
    .cv-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
  }
  @media (max-width: 1100px) and (min-width: 901px) {
    .review-grid, .bring-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/Components.jsx"></script>
  <script type="text/babel" src="components/Sections.jsx"></script>
  <script type="text/babel" src="components/App.jsx"></script>
</body>
</html>
